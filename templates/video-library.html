<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Streaming Library</title>

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        /* Modern CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header Styles */
        .app-header {
            background: var(--card-background);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-container {
            display: flex;
            background: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .search-container input {
            padding: 0.5rem 1rem;
            border: none;
            outline: none;
            min-width: 250px;
        }

        .search-container button {
            padding: 0.5rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        /* Video Grid */
        .video-grid {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: var(--card-background);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            height: 180px;
            background: #000;
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-thumbnail .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: var(--transition);
        }

        .video-card:hover .play-overlay {
            background: var(--primary-color);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .video-info {
            padding: 1rem;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .video-duration {
            background: var(--secondary-color);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* Player Modal */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .player-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: var(--card-background);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .player-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0.5rem;
            border-radius: 50%;
            transition: var(--transition);
        }

        .close-btn:hover {
            background: var(--background-color);
            color: var(--text-primary);
        }

        .video-player-container {
            position: relative;
            background: #000;
        }

        .player-controls {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 500;
            color: var(--text-primary);
        }

        .control-group select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: white;
        }

        /* Upload Modal */
        .upload-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .upload-container {
            background: var(--card-background);
            padding: 2rem;
            border-radius: var(--border-radius);
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            background: var(--background-color);
        }

        .upload-progress {
            margin: 1rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        /* Loading States */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Error States */
        .error-message {
            background: #fee2e2;
            color: var(--error-color);
            padding: 1rem;
            border-radius: var(--border-radius);
            margin: 1rem 0;
            border-left: 4px solid var(--error-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .header-controls {
                width: 100%;
            }

            .search-container input {
                min-width: 200px;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1rem;
            }

            .player-controls {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .control-group {
                justify-content: space-between;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
            }

            .video-thumbnail {
                height: 200px;
            }

            .player-container {
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <h1><i class="fas fa-video"></i> Video Library</h1>
            <div class="header-controls">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search videos...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <button id="uploadBtn" class="btn-primary">
                    <i class="fas fa-upload"></i> Upload
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Video Grid -->
        <section class="video-grid" id="videoGrid">
            <!-- Video cards will be dynamically inserted here -->
        </section>

        <!-- Video Player Modal -->
        <div class="player-modal" id="playerModal">
            <div class="player-container">
                <div class="player-header">
                    <h2 id="currentVideoTitle">Video Title</h2>
                    <button class="close-btn" id="closePlayer">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="video-player-container">
                    <video id="videoPlayer" class="video-js vjs-modern-skin" controls preload="auto">
                        <p class="vjs-no-js">
                            To view this video please enable JavaScript, and consider upgrading to a web browser that
                            <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
                        </p>
                    </video>
                </div>

                <!-- Custom Controls -->
                <div class="player-controls">
                    <div class="control-group">
                        <label>Quality:</label>
                        <select id="qualitySelect">
                            <option value="auto">Auto</option>
                            <option value="1080p">1080p</option>
                            <option value="720p">720p</option>
                            <option value="480p">480p</option>
                            <option value="360p">360p</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>Speed:</label>
                        <select id="speedSelect">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1x (Normal)</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <button id="fullscreenBtn" class="btn-secondary">
                            <i class="fas fa-expand"></i> Fullscreen
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upload Modal -->
        <div class="upload-modal" id="uploadModal">
            <div class="upload-container">
                <h3>Upload New Video</h3>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="videoFile">Select Video File:</label>
                        <input type="file" id="videoFile" accept="video/*" required>
                    </div>
                    <div class="upload-progress" id="uploadProgress" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText">Uploading...</p>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelUpload" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script>
        // Video Library Application
        class VideoLibrary {
            constructor() {
                this.videos = [];
                this.currentVideo = null;
                this.player = null;
                this.searchTimeout = null;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadVideos();
                this.initializePlayer();
            }

            setupEventListeners() {
                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.handleSearch(e.target.value);
                });

                // Video grid click
                document.getElementById('videoGrid').addEventListener('click', (e) => {
                    const videoCard = e.target.closest('.video-card');
                    if (videoCard) {
                        const videoId = videoCard.dataset.videoId;
                        this.playVideo(videoId);
                    }
                });

                // Player controls
                document.getElementById('closePlayer').addEventListener('click', () => {
                    this.closePlayer();
                });

                document.getElementById('qualitySelect').addEventListener('change', (e) => {
                    this.changeQuality(e.target.value);
                });

                document.getElementById('speedSelect').addEventListener('change', (e) => {
                    this.changeSpeed(e.target.value);
                });

                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });

                // Upload functionality
                document.getElementById('uploadBtn').addEventListener('click', () => {
                    this.showUploadModal();
                });

                document.getElementById('cancelUpload').addEventListener('click', () => {
                    this.hideUploadModal();
                });

                document.getElementById('uploadForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.uploadVideo();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    this.handleKeyboard(e);
                });

                // Click outside modal to close
                document.getElementById('playerModal').addEventListener('click', (e) => {
                    if (e.target.id === 'playerModal') {
                        this.closePlayer();
                    }
                });
            }

            async loadVideos() {
                try {
                    this.showLoading();
                    const response = await fetch('/api/v1/videos');

                    if (!response.ok) {
                        throw new Error('Failed to load videos');
                    }

                    const data = await response.json();
                    this.videos = data.videos;
                    this.renderVideoGrid(this.videos);
                } catch (error) {
                    console.error('Error loading videos:', error);
                    this.showError('Failed to load videos. Please try again.');
                } finally {
                    this.hideLoading();
                }
            }

            renderVideoGrid(videos) {
                const grid = document.getElementById('videoGrid');

                if (videos.length === 0) {
                    grid.innerHTML = '<div class="no-videos">No videos found</div>';
                    return;
                }

                grid.innerHTML = videos.map(video => this.createVideoCard(video)).join('');
            }

            createVideoCard(video) {
                const thumbnailUrl = this.getThumbnailUrl(video);
                const duration = this.formatDuration(video.duration);

                return `
                    <div class="video-card" data-video-id="${video.id}">
                        <div class="video-thumbnail">
                            <img src="${thumbnailUrl}" alt="${video.original_filename}"
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjE4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIFRodW1ibmFpbDwvdGV4dD48L3N2Zz4='">
                            <div class="play-overlay">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.original_filename}</div>
                            <div class="video-meta">
                                <span>${this.formatFileSize(video.file_size)}</span>
                                <span class="video-duration">${duration}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            async playVideo(videoId) {
                try {
                    const video = this.videos.find(v => v.id === videoId);
                    if (!video) {
                        throw new Error('Video not found');
                    }

                    this.currentVideo = video;
                    document.getElementById('currentVideoTitle').textContent = video.original_filename;

                    // Check if video is prepared for streaming
                    const streamingResponse = await fetch(`/api/v1/videos/${videoId}/streaming-info`);

                    if (!streamingResponse.ok) {
                        // Video not prepared for streaming, prepare it
                        await this.prepareStreaming(videoId);
                        return;
                    }

                    const streamingInfo = await streamingResponse.json();

                    if (!streamingInfo.streaming_ready) {
                        await this.prepareStreaming(videoId);
                        return;
                    }

                    // Load video stream
                    this.loadVideoStream(videoId, streamingInfo);
                    this.showPlayerModal();

                } catch (error) {
                    console.error('Error playing video:', error);
                    this.showError('Failed to play video. Please try again.');
                }
            }

            async prepareStreaming(videoId) {
                try {
                    this.showStatus('Preparing video for streaming...', 'info');

                    const response = await fetch(`/api/v1/videos/${videoId}/prepare-streaming`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            qualities: ['360p', '480p', '720p', '1080p']
                        })
                    });

                    if (response.ok) {
                        this.showStatus('Streaming preparation started. Please wait...', 'info');

                        // Poll for completion
                        setTimeout(() => this.checkStreamingStatus(videoId), 5000);
                    } else {
                        throw new Error('Failed to prepare streaming');
                    }
                } catch (error) {
                    console.error('Error preparing streaming:', error);
                    this.showError('Failed to prepare video for streaming.');
                }
            }

            async checkStreamingStatus(videoId) {
                try {
                    const response = await fetch(`/api/v1/videos/${videoId}/streaming-info`);

                    if (response.ok) {
                        const streamingInfo = await response.json();
                        if (streamingInfo.streaming_ready) {
                            this.loadVideoStream(videoId, streamingInfo);
                            this.showPlayerModal();
                        } else {
                            // Continue polling
                            setTimeout(() => this.checkStreamingStatus(videoId), 3000);
                        }
                    }
                } catch (error) {
                    console.error('Error checking streaming status:', error);
                }
            }

            loadVideoStream(videoId, streamingInfo) {
                const streamUrl = `/api/v1/videos/${videoId}/master.m3u8`;

                if (this.player) {
                    this.player.src({
                        src: streamUrl,
                        type: 'application/x-mpegURL'
                    });

                    // Update quality options
                    this.updateQualityOptions(streamingInfo.qualities);
                }
            }

            updateQualityOptions(qualities) {
                const qualitySelect = document.getElementById('qualitySelect');
                qualitySelect.innerHTML = '<option value="auto">Auto</option>';

                qualities.forEach(quality => {
                    qualitySelect.innerHTML += `<option value="${quality}">${quality}</option>`;
                });
            }

            changeQuality(quality) {
                if (!this.player || !this.currentVideo) return;

                if (quality === 'auto') {
                    // Let Video.js handle adaptive streaming
                    this.player.src({
                        src: `/api/v1/videos/${this.currentVideo.id}/master.m3u8`,
                        type: 'application/x-mpegURL'
                    });
                } else {
                    // Load specific quality playlist
                    this.player.src({
                        src: `/api/v1/videos/${this.currentVideo.id}/stream/${quality}.m3u8`,
                        type: 'application/x-mpegURL'
                    });
                }
            }

            changeSpeed(speed) {
                if (this.player) {
                    this.player.playbackRate(parseFloat(speed));
                }
            }

            toggleFullscreen() {
                if (this.player) {
                    if (this.player.isFullscreen()) {
                        this.player.exitFullscreen();
                    } else {
                        this.player.requestFullscreen();
                    }
                }
            }

            handleSearch(query) {
                clearTimeout(this.searchTimeout);

                this.searchTimeout = setTimeout(() => {
                    if (!query.trim()) {
                        this.renderVideoGrid(this.videos);
                        return;
                    }

                    const filtered = this.videos.filter(video =>
                        video.original_filename.toLowerCase().includes(query.toLowerCase())
                    );

                    this.renderVideoGrid(filtered);
                }, 300);
            }

            handleKeyboard(e) {
                if (!this.player) return;

                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        if (this.player.paused()) {
                            this.player.play();
                        } else {
                            this.player.pause();
                        }
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        this.toggleFullscreen();
                        break;
                    case 'Escape':
                        if (document.getElementById('playerModal').style.display !== 'none') {
                            this.closePlayer();
                        }
                        break;
                }
            }

            showPlayerModal() {
                document.getElementById('playerModal').style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }

            closePlayer() {
                document.getElementById('playerModal').style.display = 'none';
                document.body.style.overflow = 'auto';

                if (this.player) {
                    this.player.pause();
                }
            }

            showUploadModal() {
                document.getElementById('uploadModal').style.display = 'flex';
            }

            hideUploadModal() {
                document.getElementById('uploadModal').style.display = 'none';
                document.getElementById('uploadForm').reset();
                document.getElementById('uploadProgress').style.display = 'none';
            }

            async uploadVideo() {
                const fileInput = document.getElementById('videoFile');
                const file = fileInput.files[0];

                if (!file) {
                    this.showError('Please select a video file');
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                const progressContainer = document.getElementById('uploadProgress');
                const progressFill = document.getElementById('progressFill');
                const progressText = document.getElementById('progressText');

                progressContainer.style.display = 'block';

                try {
                    const response = await fetch('/api/v1/upload', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        this.showStatus('Video uploaded successfully!', 'success');
                        this.hideUploadModal();

                        // Reload videos
                        setTimeout(() => this.loadVideos(), 1000);
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    this.showError('Failed to upload video. Please try again.');
                } finally {
                    progressContainer.style.display = 'none';
                }
            }

            initializePlayer() {
                this.player = videojs('videoPlayer', {
                    html5: {
                        hls: {
                            overrideNative: !videojs.browser.IS_SAFARI
                        }
                    },
                    playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
                    responsive: true,
                    fluid: true
                });

                this.player.ready(() => {
                    console.log('Video.js player initialized');
                });
            }

            // Utility methods
            getThumbnailUrl(video) {
                // Return a placeholder or generate thumbnail URL
                return `/static/thumbnails/${video.id}.jpg`;
            }

            formatDuration(seconds) {
                if (!seconds) return '0:00';

                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);

                if (hours > 0) {
                    return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            }

            formatFileSize(bytes) {
                if (!bytes) return '0 B';

                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return `${(bytes / Math.pow(1024, i)).toFixed(1)} ${sizes[i]}`;
            }

            showLoading() {
                document.getElementById('videoGrid').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading videos...</p>
                    </div>
                `;
            }

            hideLoading() {
                // Loading will be replaced when videos are rendered
            }

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;

                const container = document.querySelector('.main-content');
                container.insertBefore(errorDiv, container.firstChild);

                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }

            showStatus(message, type = 'info') {
                // You can implement a status notification system here
                console.log(`${type}: ${message}`);
            }
        }

        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new VideoLibrary();
        });
    </script>
</body>
</html>
